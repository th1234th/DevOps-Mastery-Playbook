apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-lab
  labels:
    app.kubernetes.io/name: release-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: release-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-lab
    spec:
      containers:
        - name: app
          image: release-lab:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 10
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5