name: Publish private runner image family

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "03-gitops-and-strategy/github-runner-lab/runner-image/**"
      - ".github/workflows/publish-private-runner-images.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            target: base
          - variant: node
            target: node
          - variant: build
            target: build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize package owner
        id: package-owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          LOWERCASE_OWNER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "value=$LOWERCASE_OWNER" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish private image variant
        uses: docker/build-push-action@v6
        id: publish
        with:
          context: 03-gitops-and-strategy/github-runner-lab/runner-image
          file: 03-gitops-and-strategy/github-runner-lab/runner-image/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.package-owner.outputs.value }}/private-actions-runner:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=runner-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.variant }}
          provenance: true
          sbom: true

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ steps.package-owner.outputs.value }}/private-actions-runner:${{ matrix.variant }}-${{ github.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf -- '- `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"