name: Playbook quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local Markdown links
        run: python scripts/check_local_links.py
      - name: Compile checker
        run: python -m py_compile scripts/check_local_links.py