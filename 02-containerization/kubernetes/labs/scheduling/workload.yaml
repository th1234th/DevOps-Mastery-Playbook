apiVersion: v1
kind: Namespace
metadata:
  name: scheduling-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-demo
  namespace: scheduling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placement-demo
  template:
    metadata:
      labels:
        app: placement-demo
    spec:
      nodeSelector:
        lab-role: general
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi