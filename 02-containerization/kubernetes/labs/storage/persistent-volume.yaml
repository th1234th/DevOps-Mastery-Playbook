apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-lab-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-lab-manual
  hostPath:
    path: /mnt/storage-lab
    type: DirectoryOrCreate