apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: storage-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date -u +%FT%TZ >> /data/checkpoints.log; sleep 5; done"]
          volumeMounts:
            - name: checkpoint
              mountPath: /data
      volumes:
        - name: checkpoint
          persistentVolumeClaim:
            claimName: checkpoint