apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshooting-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: troubleshooting-lab
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http